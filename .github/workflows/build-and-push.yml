name: Build, Push & Deploy to VPS (Private)

# Builds a Docker image from your fork, pushes it to GHCR (private),
# then automatically deploys it to your VPS via SSH.
#
# After a successful run, your image will be at:
#   ghcr.io/MoatazMahmoud404/GZCTF/gzctf:develop
#
# Required repo secrets (Settings > Secrets > Actions):
#   None for build — uses GITHUB_TOKEN (auto-available)
#
# Required for auto-deploy to VPS (add these in GitHub repo Settings):
#   VPS_SSH_KEY  — your SSH private key (the .pem file contents)
#   VPS_HOST     — your VPS IP or domain (e.g. 74.162.120.3)
#   VPS_USER     — SSH username (e.g. azureuser)

on:
  push:
    branches:
      - develop # auto-build when you push to develop
      - main # auto-build when you push to main
      - feature/** # auto-build feature branches too
    paths:
      - "src/**" # only run when source code changes
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: # manual trigger
    inputs:
      tags:
        description: "Additional tags (comma-separated, e.g. v1.0.0,latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write # needed to push to GHCR

env:
  # Force the Dockerfile to publish only the host platform (faster builds)
  RELEASE: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/GZCTF
    steps:
      # 1. Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Setup .NET SDK (matching global.json)
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/global.json

      # 3. Setup Node.js (needed for the frontend build)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      # 4. Setup pnpm (the project uses pnpm 11)
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # 5. Generate a build timestamp
      - name: Get current date time
        id: datetime
        uses: Kaven-Universe/github-action-current-date-time@v1
        with:
          format: "YYYY-MM-DDTHH:mm:ssZ"

      # 6. Setup Docker Buildx (multi-platform builds)
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 7. Pre-build (restores NuGet packages and compiles)
      - name: Prebuild project
        run: |
          dotnet build "GZCTF.csproj" -c Release -o build

      # 8. Publish for linux/amd64 (you can add arm64 later)
      - name: Publish project
        run: |
          dotnet publish "GZCTF.csproj" -c Release -o publish/linux/amd64 -r linux-x64 --no-self-contained /p:PublishReadyToRun=true
        env:
          VITE_APP_BUILD_TIMESTAMP: ${{ steps.datetime.outputs.time }}
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_GIT_NAME: ${{ github.ref_name }}

      # 9. Login to GitHub Container Registry (GHCR)
      #     Uses GITHUB_TOKEN — no extra secrets needed!
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Generate Docker tags
      - name: Generate Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/gzctf
          flavor: |
            latest=${{ github.ref_name == 'develop' }}
          tags: |
            # Tag with the branch name (e.g. develop, main, feature/xyz)
            type=ref,event=branch
            # Tag with the commit SHA (unique per build)
            type=sha,prefix=,suffix=,format=short
            # Allow manual tags from workflow_dispatch
            type=raw,value=${{ inputs.tags }},enable=${{ inputs.tags != '' }}

      # 11. Build & push the Docker image (ONLY to GHCR — not Docker Hub)
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./src/GZCTF
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true

      # 12. Summary — show where the image was published
      - name: Print image info
        run: |
          echo "## ✅ Image published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            echo "- \`${tag}\`" >> $GITHUB_STEP_SUMMARY
          done

  # =========================================================================
  #  DEPLOY to VPS — auto-deploy after build (requires VPS secrets)
  # =========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check VPS secrets
        id: check
        run: |
          if [ "${{ secrets.VPS_SSH_KEY }}" != "" ] && [ "${{ secrets.VPS_HOST }}" != "" ]; then
            echo "✅ VPS secrets found → will deploy"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️  VPS secrets not set → skipping deploy"
            echo "   Add VPS_SSH_KEY, VPS_HOST, and VPS_USER to repo secrets"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.available == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Connected to VPS!"
            cd ~/gzctf

            echo "📦 Pulling latest image from GHCR..."
            docker compose pull gzctf

            echo "🔍 Checking container status..."
            if [ "$(docker ps -q -f name=gzctf)" ]; then
              echo "✅ Container is running → restarting gracefully..."
              docker compose down
              docker compose up -d
              echo "✅ Container restarted!"
            elif [ "$(docker ps -aq -f name=gzctf)" ]; then
              echo "⏸️  Container exists but stopped → starting..."
              docker compose up -d
              echo "✅ Container started!"
            else
              echo "🆕 Container not found → creating fresh..."
              docker compose up -d
              echo "✅ Container created and started!"
            fi

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            echo "🌐 http://${{ secrets.VPS_HOST }}:8081"
